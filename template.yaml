AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  TA-2: Event-driven S3 file processing with Lambda in a private subnet
  and SNS email notifications.

Parameters:
  NotificationEmail:
    Type: String
    Description: Email address that will receive processing alerts.
    AllowedPattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$'
    ConstraintDescription: Enter a valid email address.

Resources:
  FileProcessingVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: file-processing-vpc

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: file-processing-igw

  AttachInternetGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref FileProcessingVPC
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref FileProcessingVPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select
        - 0
        - !GetAZs ''
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: file-processing-public-subnet

  PrivateSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref FileProcessingVPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select
        - 0
        - !GetAZs ''
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: file-processing-private-subnet

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref FileProcessingVPC
      Tags:
        - Key: Name
          Value: file-processing-public-rt

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachInternetGateway
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  NatEIP:
    Type: AWS::EC2::EIP
    DependsOn: AttachInternetGateway
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: file-processing-nat-eip

  NatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEIP.AllocationId
      SubnetId: !Ref PublicSubnet
      Tags:
        - Key: Name
          Value: file-processing-nat

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref FileProcessingVPC
      Tags:
        - Key: Name
          Value: file-processing-private-rt

  PrivateDefaultRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

  PrivateSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet
      RouteTableId: !Ref PrivateRouteTable

  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for file-processing Lambda
      VpcId: !Ref FileProcessingVPC
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: file-processing-lambda-sg

  FileProcessingTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: FileProcessingAlerts
      DisplayName: File Processing Alerts

  EmailSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref FileProcessingTopic
      Protocol: email
      Endpoint: !Ref NotificationEmail

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: FileProcessingS3AndSNS
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadUploadedObjectsAndWriteMetadata
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub arn:${AWS::Partition}:s3:::file-processing-${AWS::AccountId}-${AWS::Region}/*
              - Sid: PublishProcessingAlerts
                Effect: Allow
                Action:
                  - sns:Publish
                Resource: !Ref FileProcessingTopic

  FileProcessingFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: FileProcessingFunction
      Runtime: python3.12
      Handler: index.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 30
      MemorySize: 128
      VpcConfig:
        SubnetIds:
          - !Ref PrivateSubnet
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup
      Environment:
        Variables:
          SNS_TOPIC_ARN: !Ref FileProcessingTopic
      Code:
        ZipFile: |
          import json
          import os
          import urllib.parse
          from datetime import datetime, timezone

          import boto3

          s3 = boto3.client("s3")
          sns = boto3.client("sns")
          topic_arn = os.environ["SNS_TOPIC_ARN"]

          def lambda_handler(event, context):
              results = []
              for record in event.get("Records", []):
                  bucket = record["s3"]["bucket"]["name"]
                  key = urllib.parse.unquote_plus(record["s3"]["object"]["key"])

                  # The S3 notification is limited to uploads/ to avoid
                  # recursively processing metadata written under processed/.
                  if not key.startswith("uploads/"):
                      continue

                  head = s3.head_object(Bucket=bucket, Key=key)
                  metadata = {
                      "source_bucket": bucket,
                      "source_key": key,
                      "size_bytes": head.get("ContentLength", 0),
                      "content_type": head.get("ContentType", "unknown"),
                      "processed_at_utc": datetime.now(timezone.utc).isoformat(),
                      "status": "SUCCESS"
                  }

                  output_key = "processed/" + key[len("uploads/"):] + ".metadata.json"
                  s3.put_object(
                      Bucket=bucket,
                      Key=output_key,
                      Body=json.dumps(metadata, indent=2).encode("utf-8"),
                      ContentType="application/json"
                  )

                  message = (
                      "File processed successfully.\n"
                      f"Bucket: {bucket}\n"
                      f"Uploaded key: {key}\n"
                      f"Metadata key: {output_key}\n"
                      f"Size (bytes): {metadata['size_bytes']}"
                  )
                  sns.publish(
                      TopicArn=topic_arn,
                      Subject="S3 file processed successfully",
                      Message=message
                  )
                  results.append(metadata)

              return {"statusCode": 200, "processed": len(results), "results": results}

  LambdaInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt FileProcessingFunction.Arn
      Principal: s3.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      # Deliberately construct the bucket ARN without Ref/GetAtt to avoid
      # a circular dependency with the bucket's notification configuration.
      SourceArn: !Sub arn:${AWS::Partition}:s3:::file-processing-${AWS::AccountId}-${AWS::Region}

  FileUploadBucket:
    Type: AWS::S3::Bucket
    DependsOn:
      - LambdaInvokePermission
    Properties:
      BucketName: !Sub file-processing-${AWS::AccountId}-${AWS::Region}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: s3:ObjectCreated:*
            Function: !GetAtt FileProcessingFunction.Arn
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: uploads/
      Tags:
        - Key: Name
          Value: file-processing-upload-bucket

Outputs:
  S3BucketName:
    Description: Upload test files under the uploads/ prefix in this bucket.
    Value: !Ref FileUploadBucket

  LambdaFunctionName:
    Value: !Ref FileProcessingFunction

  SNSTopicArn:
    Value: !Ref FileProcessingTopic

  VPCId:
    Value: !Ref FileProcessingVPC

  PrivateSubnetId:
    Value: !Ref PrivateSubnet
